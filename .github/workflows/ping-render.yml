name: Ping Render App

on:
  schedule:
    # Run every 10 minutes to prevent the Render free tier from going to sleep.
    # Note: Render free tier services sleep after 15 mins of inactivity.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application
        run: curl -sSf https://expense-tracker-250p.onrender.com/ > /dev/null || echo "Ping failed, but continuing"
