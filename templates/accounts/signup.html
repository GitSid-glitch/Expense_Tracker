{% extends "base.html" %}
{% load socialaccount %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">Create account</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Sign up</button>
                </form>
                <hr>
                {% if google_auth_enabled %}
                    <a href="{% provider_login_url 'google' process='login' %}" class="btn btn-outline-dark">Sign up with Google</a>
                {% else %}
                    <p class="text-muted mb-0">Google sign-up will work after you add the Google OAuth client ID and secret.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
